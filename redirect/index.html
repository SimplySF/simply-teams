<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Moved to the Simply CLI documentation</title>
    <link rel="canonical" href="https://simplysf.github.io/simply-cli/teams/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://simplysf.github.io/simply-cli/teams/" />
    <script>
      // Carry the reader to the same page under the combined site: every old path has a direct
      // equivalent one level deeper, so /simply-teams/guides/credentials/ becomes
      // /simply-cli/teams/guides/credentials/. Meta refresh above is the no-JavaScript fallback.
      (function () {
        var rest = location.pathname.replace(/^\/simply-teams\/?/, '');
        location.replace('https://simplysf.github.io/simply-cli/teams/' + rest + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>
      This documentation has moved to
      <a href="https://simplysf.github.io/simply-cli/teams/">the Simply CLI documentation site</a>.
    </p>
  </body>
</html>
